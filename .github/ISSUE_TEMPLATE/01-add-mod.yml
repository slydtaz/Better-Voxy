name: Suggest an additional mod
description: Suggest a mod that could improve Better Voxy.
title: "[Mod Suggestion]: "
body:
  - type: markdown
    attributes:
      value: |
        Suggest mods that fit Better Voxy's focus on Voxy, distant terrain rendering, and performance.
        Please link to the official Modrinth or CurseForge project page. Do not attach mod JARs.
  - type: input
    id: mod-name
    attributes:
      label: Mod name
      description: What is the exact name of the mod?
      placeholder: "Example: Example Optimization Mod"
    validations:
      required: true
  - type: input
    id: project-link
    attributes:
      label: Official project page
      description: Link to the mod's official Modrinth, CurseForge, or source page.
      placeholder: "https://modrinth.com/mod/..."
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What would this mod add or improve?
      description: Explain the benefit in your own words.
      placeholder: "Describe the performance improvement, feature, or problem it would solve."
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: How should it be included?
      options:
        - Required in every installation
        - Optional, if the launcher supports it
        - Not sure; please evaluate it
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility information
      description: Include known support for Minecraft 26.2, Fabric, and any conflicts or dependencies you know about.
      placeholder: "Share links or compatibility notes."
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and extra context
      description: Is there already a mod in Better Voxy that does something similar?
      placeholder: "Optional details."
    validations:
      required: false
