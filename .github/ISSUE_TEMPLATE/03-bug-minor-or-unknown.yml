name: Report a minor or unknown bug
description: Something looks wrong or a feature isn't working, but the game doesn't crash? Report it here.
title: "[Minor Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for issues like visual glitches, features that don't behave as expected, or other problems that don't crash the game.
        If Minecraft crashes, won't launch, or freezes so badly that you can't keep playing, use **Report a crash or serious issue** instead.
  - type: dropdown
    id: category
    attributes:
      label: What kind of issue is it?
      options:
        - Voxy or distant terrain rendering
        - Performance or stuttering
        - A mod feature isn't working
        - Visual or UI glitch
        - A configuration behaves unexpectedly
        - Other / not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Better Voxy and Minecraft versions
      description: Which release of the pack and Minecraft are you using?
      placeholder: "For example: Better Voxy 1.0.0, Minecraft 26.2"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Tell us what you noticed and where it happened. It's okay if you don't know which mod is responsible.
      placeholder: "Describe what you saw, in your own words."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: If you know how to trigger the issue again, list the steps.
      placeholder: |
        1. Open a world...
        2. Do or change something...
        3. Notice the issue...
    validations:
      required: false
  - type: textarea
    id: expected-actual
    attributes:
      label: What did you expect, and what happened instead?
      placeholder: "Describe the difference between what you expected and what you saw."
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Occasionally
        - Happened once
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Your setup and any recent changes
      description: Mention shaders, settings, or extra mods if they're relevant. Include your GPU or operating system only when it helps explain the issue.
      placeholder: "What are you running, and did you change anything before this started?"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: A screenshot or a short log excerpt can help. Remove usernames, access tokens, and private server addresses first.
      placeholder: "Paste a relevant excerpt or share a link."
    validations:
      required: false
