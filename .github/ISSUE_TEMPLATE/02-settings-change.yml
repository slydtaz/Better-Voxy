name: Suggest a configuration change
description: Think a default or setting could be better? Share your idea.
title: "[Configuration]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form to suggest a new option, a different default, or a change to an existing setting.
        Please leave out passwords, access tokens, and other private information.
  - type: input
    id: setting
    attributes:
      label: Which setting or feature is this about?
      description: Name the setting, mod, or part of the pack you have in mind.
      placeholder: "For example: Voxy rendering distance"
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: What happens now?
      description: Describe the current behavior and its value, if you know it.
      placeholder: "What does the setting do at the moment?"
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: What would you change?
      description: Explain the change you'd like to see.
      placeholder: "Describe your proposed setting or new default."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      description: Tell us who this would help and what problem it could solve.
      placeholder: "For example, a performance, compatibility, usability, or visual improvement."
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: How should the change work?
      options:
        - Change the default for everyone
        - Add an option users can change themselves
        - Add a preset or profile
        - Not sure; please evaluate it
    validations:
      required: true
  - type: textarea
    id: files-and-impact
    attributes:
      label: Config file or possible trade-offs
      description: If you know the file or setting name, include it. Mention any performance or compatibility trade-offs you expect.
      placeholder: "Optional. Please don't attach world saves or private files."
    validations:
      required: false
