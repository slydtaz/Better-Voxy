name: Report a crash or serious issue
description: Minecraft won't launch, crashes, or freezes badly enough to stop you playing? Start here.
title: "[Crash / Critical Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form if Minecraft crashes, won't start, freezes so badly that you can't continue, or you suspect a mod conflict or configuration change caused a serious problem.
        If possible, include the crash report or a link to `logs/latest.log`. Please don't upload your entire Minecraft folder or a world save, and remove access tokens or other private information from logs.
  - type: dropdown
    id: failure-stage
    attributes:
      label: When does it happen?
      options:
        - The launcher cannot install the modpack
        - Minecraft crashes during startup
        - Minecraft crashes while loading a world
        - The game crashes during gameplay
        - The game freezes or becomes unplayable
        - The issue starts after changing a configuration
        - Not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Better Voxy, Minecraft, and Fabric Loader versions
      description: Include all three if you can find them.
      placeholder: "For example: Better Voxy 1.0.0, Minecraft 26.2, Fabric Loader 0.19.5"
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: What happened just before the crash or freeze?
      description: Include any error message and what you were doing when it happened.
      placeholder: "Walk us through what happened before the problem appeared."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Can you reproduce it? If so, how?
      placeholder: |
        1. Start Better Voxy...
        2. Open a world or do something...
        3. The game crashes or freezes...
    validations:
      required: true
  - type: textarea
    id: config-changes
    attributes:
      label: Have you changed any settings?
      description: List the config files and values you changed. If you haven't changed any settings, write "None".
      placeholder: "For example: changed a value in config/... from ... to ..."
    validations:
      required: true
  - type: textarea
    id: mod-changes
    attributes:
      label: Have you added, removed, or updated any mods?
      description: Let us know whether the issue also happens in a clean Better Voxy instance.
      placeholder: |
        Extra mods:
        Removed or updated mods:
        Happens in a clean instance? Yes / No / Not tested
    validations:
      required: true
  - type: textarea
    id: crash-report
    attributes:
      label: Crash report or latest.log
      description: Share a link to the crash report or `logs/latest.log`. If the file is very long, use a paste service you trust. Remove access tokens, usernames, and private server addresses before sharing.
      placeholder: "Paste a link to the relevant log or crash report."
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: What have you already tried?
      description: For example, testing without shaders, restoring a previous config, or trying a clean instance.
      placeholder: "List anything you've tried and whether it changed the result."
    validations:
      required: false
